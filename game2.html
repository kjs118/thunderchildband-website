<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brake Down - HTML5 Version</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: none; background: black; }
  #menu {
    text-align: center;
  }
  button {
    display: block;
    margin: 10px auto;
    padding: 12px 30px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  #scoreboard { font-size: 28px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="menu">
  <div id="scoreboard"></div>
  <button id="hardBtn">Hard</button>
  <button id="harderBtn">Harder</button>
  <button id="gluttonBtn">I'm a Glutton for Punishment</button>
</div>

<canvas id="gameCanvas" width="375" height="812"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;

const BLACK = "#000";
const WHITE = "#fff";

const BLOCK_COLORS = ["#FF6464","#FFA500","#FFFF00","#64FF64","#00C8FF","#6464FF","#C800FF","#FF3296"];
const NUM_COLUMNS = BLOCK_COLORS.length;
const COLUMN_WIDTH = SCREEN_WIDTH / NUM_COLUMNS;

const BAR_Y = SCREEN_HEIGHT - 170;
const BAR_HEIGHT = 60;
const HOLE_WIDTH = 80;
const HOLE_HEIGHT = BAR_HEIGHT;
const SLIDE_SPEED = 4.5;

// Shared state
let state = "menu";
let difficulty = "harder"; // default
let barFlashColor = WHITE;

// ---- MENU ----
const menuDiv = document.getElementById('menu');
const scoreboard = document.getElementById('scoreboard');
let highScore = parseInt(localStorage.getItem('brakeDownHighScore')) || 0;
scoreboard.innerText = "High Score: " + highScore;

document.getElementById('hardBtn').onclick = () => startGame('hard');
document.getElementById('harderBtn').onclick = () => startGame('harder');
document.getElementById('gluttonBtn').onclick = () => startGame('glutton');

function startGame(level) {
    difficulty = level;
    menuDiv.style.display = "none";
    canvas.style.display = "block";
    if(level === "glutton"){
        initGlutton();
    } else {
        initHarder();
    }
}

// ================= HARD/HARDER =================
let holeX, blocks, spawnTimer, fallSpeed, score, blockCount, mouseDown;

function initHarder(){
    holeX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
    blocks = [];
    spawnTimer = 165;
    fallSpeed = 2.2;
    score = 0;
    blockCount = 0;
    mouseDown = false;
    state = "playing";
    barFlashColor = WHITE;
}

// ================= GLUTTON =================
let gluttonBars;

function initGlutton(){
    state = "playing";
    // Bar setup: half-height, 2 bar space in middle
    const halfBarHeight = BAR_HEIGHT/2;
    const spacing = BAR_HEIGHT*2;
    gluttonBars = [
        { x: SCREEN_WIDTH/2 - HOLE_WIDTH/2, y: SCREEN_HEIGHT/2 - spacing/2 - halfBarHeight, direction: -1, barColor: WHITE },
        { x: SCREEN_WIDTH/2 - HOLE_WIDTH/2, y: SCREEN_HEIGHT/2 + spacing/2, direction: 1, barColor: WHITE }
    ];
}

// ---- INPUT ----
canvas.addEventListener('mousedown', () => { mouseDown = true; });
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); mouseDown = true; });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); mouseDown = false; });

// ---- HARDER BAR UTILS ----
function getHoleLeft(){ 
    let left = holeX % SCREEN_WIDTH; 
    if(left<0) left+=SCREEN_WIDTH; 
    return left;
}

// ---- GLUTTON BAR DRAW ----
function drawGluttonBars(){
    gluttonBars.forEach(bar=>{
        // Move bar
        bar.x += SLIDE_SPEED*bar.direction;

        // Wrap around like Hard/Harder
        if(bar.x > SCREEN_WIDTH) bar.x -= SCREEN_WIDTH;
        if(bar.x + HOLE_WIDTH < 0) bar.x += SCREEN_WIDTH;

        // Draw full bar
        ctx.fillStyle = bar.barColor;
        ctx.fillRect(0, bar.y, SCREEN_WIDTH, BAR_HEIGHT/2);

        // Draw hole
        const left = bar.x % SCREEN_WIDTH;
        ctx.fillStyle = BLACK;
        ctx.fillRect(left, bar.y, HOLE_WIDTH, BAR_HEIGHT/2);
        if(left + HOLE_WIDTH > SCREEN_WIDTH) ctx.fillRect(left - SCREEN_WIDTH, bar.y, HOLE_WIDTH, BAR_HEIGHT/2);
    });
}

// ---- UPDATE LOOP ----
function update(){
    if(state!=="playing") return;

    if(difficulty==="glutton"){
        // Bars already move in draw
    } else {
        // Hard/Harder bar logic here
        if(!mouseDown) holeX-=SLIDE_SPEED;
    }
}

// ---- DRAW LOOP ----
function draw(){
    ctx.fillStyle=BLACK; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

    if(difficulty==="glutton"){
        drawGluttonBars();
    } else {
        // Hard/Harder bar
        ctx.fillStyle=barFlashColor;
        ctx.fillRect(0,BAR_Y,SCREEN_WIDTH,BAR_HEIGHT);
        const left = getHoleLeft();
        ctx.fillStyle=BLACK;
        ctx.fillRect(left,BAR_Y,HOLE_WIDTH,BAR_HEIGHT);
        if(left+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(left-SCREEN_WIDTH,BAR_Y,HOLE_WIDTH,BAR_HEIGHT);
    }
}

// ---- MAIN LOOP ----
function loop(){ update(); draw(); requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
