<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brake Down - HTML5 Version</title>
<style>
body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
canvas { display: none; background: black; }
#menu { text-align: center; }
button {
    display: block;
    margin: 10px auto;
    padding: 12px 30px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
}
#scoreboard { font-size: 28px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="menu">
  <div id="scoreboard"></div>
  <button id="hardBtn">Hard</button>
  <button id="harderBtn">Harder</button>
  <button id="gluttonBtn">I'm a Glutton for Punishment</button>
</div>

<canvas id="gameCanvas" width="375" height="812"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;
const BLACK = "#000";
const WHITE = "#fff";
const BLOCK_COLORS = ["#FF6464","#FFA500","#FFFF00","#64FF64","#00C8FF","#6464FF","#C800FF","#FF3296"];
const NUM_COLUMNS = BLOCK_COLORS.length;
const COLUMN_WIDTH = SCREEN_WIDTH / NUM_COLUMNS;

const BAR_HEIGHT = 60;
const HOLE_WIDTH = 80;
const SLIDE_SPEED = 4.5;
const SPAWN_INTERVAL_FRAMES = 165;
const NORMAL_WIDTH = Math.floor(HOLE_WIDTH*0.45);
const WIDE_WIDTH = Math.floor(HOLE_WIDTH*0.9);
const INITIAL_FALL_SPEED = 2.2;
const FALL_SPEED_INCREASE = 0.3;
const MAX_LEVELS = 5;
const SCORE_INTERVAL = 20;

// State
let difficulty = "harder";
let state = "menu";
let score = 0;
let highScore = parseInt(localStorage.getItem('brakeDownHighScore')) || 0;
let blocks = [];
let spawnTimer = SPAWN_INTERVAL_FRAMES;
let fallSpeed = INITIAL_FALL_SPEED;
let blockCount = 0;
let holeX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let barFlashColor = WHITE;
let mouseDown = false;

// Glutton bars
let topBarX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let bottomBarX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let topKeyHeld = false;
let bottomKeyHeld = false;

// ---- MENU ----
const menuDiv = document.getElementById('menu');
const scoreboard = document.getElementById('scoreboard');
scoreboard.innerText = "High Score: " + highScore;

document.getElementById('hardBtn').onclick = () => startGame('hard');
document.getElementById('harderBtn').onclick = () => startGame('harder');
document.getElementById('gluttonBtn').onclick = () => startGame('glutton');

function startGame(level){
    difficulty = level;
    menuDiv.style.display = "none";
    canvas.style.display = "block";
    resetGame();
}

// ---- INPUT ----
canvas.addEventListener('mousedown', () => { 
    if(state === "game_over") resetGame();
    mouseDown = true;
    if(difficulty==="hard") predictBarFlash();
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', (e) => { 
    e.preventDefault();
    if(state === "game_over") resetGame();
    mouseDown = true;
    if(difficulty==="hard") predictBarFlash();
});
canvas.addEventListener('touchend', (e) => { 
    e.preventDefault();
    mouseDown = false;
});

// Glutton keys
document.addEventListener('keydown',(e)=>{
    if(difficulty!=="glutton") return;
    if(e.key==='w') topKeyHeld=true;
    if(e.key==='s') bottomKeyHeld=true;
});
document.addEventListener('keyup',(e)=>{
    if(difficulty!=="glutton") return;
    if(e.key==='w') topKeyHeld=false;
    if(e.key==='s') bottomKeyHeld=false;
});

// ---- BLOCK CLASS ----
class Block{
    constructor(x,fallSpeed,width,fromTop=true){
        this.x=x; this.width=width; this.height=BAR_HEIGHT;
        this.fallSpeed=fromTop?fallSpeed:-fallSpeed;
        this.y=fromTop?-this.height:SCREEN_HEIGHT;
        this.column=Math.floor(x/COLUMN_WIDTH)%NUM_COLUMNS;
        this.baseColor=BLOCK_COLORS[this.column];
        this.color=this.baseColor;
        this.scored=false;
        this.isWide=width>NORMAL_WIDTH;
        this.fromTop=fromTop;
    }
    update(){ this.y+=this.fallSpeed; }
    draw(){ ctx.fillStyle=this.color; ctx.fillRect(this.x,this.y,this.width,this.height); }
}

// ---- FUNCTIONS ----
function spawnBlock(fromTop=true){
    blockCount++;
    const isWide = (blockCount%5===0);
    const w = isWide? WIDE_WIDTH:NORMAL_WIDTH;
    const x = Math.random()*(SCREEN_WIDTH-w);
    blocks.push(new Block(x,fallSpeed,w,fromTop));
}

function getHoleLeft(){ return holeX%SCREEN_WIDTH<0?holeX+SCREEN_WIDTH:holeX; }
function blockPassesHole(block, barX){
    const left=barX; const right=barX+HOLE_WIDTH;
    const blockRight=block.x+block.width;
    if(right<=SCREEN_WIDTH) return block.x>=left && blockRight<=right;
    return (block.x>=left)||(blockRight<=right-SCREEN_WIDTH);
}

function updateFallSpeed(){
    const level = Math.min(Math.floor(score/SCORE_INTERVAL),MAX_LEVELS);
    fallSpeed = INITIAL_FALL_SPEED + level*FALL_SPEED_INCREASE;
}

function resetGame(){
    state="playing"; score=0; blocks=[]; spawnTimer=SPAWN_INTERVAL_FRAMES;
    fallSpeed=INITIAL_FALL_SPEED; blockCount=0; holeX=SCREEN_WIDTH/2-HOLE_WIDTH/2;
    barFlashColor=WHITE; topBarX=SCREEN_WIDTH/2-HOLE_WIDTH/2; bottomBarX=SCREEN_WIDTH/2-HOLE_WIDTH/2;
    topKeyHeld=false; bottomKeyHeld=false;
}

// ---- HARD FLASH ----
function getClosestBlockAboveBar(){
    let closest=null,minDistance=Infinity;
    blocks.forEach(block=>{
        if(block.y+block.height<BAR_HEIGHT+SCREEN_HEIGHT-BAR_HEIGHT){
            const dist=SCREEN_HEIGHT-BAR_HEIGHT-(block.y+block.height);
            if(dist<minDistance){ minDistance=dist; closest=block;}
        }
    });
    return closest;
}
function predictBarFlash(){
    const block=getClosestBlockAboveBar(); if(!block) return;
    const blockLeft=block.x; const blockRight=block.x+block.width;
    let holeLeft=getHoleLeft(); let holeRight=holeLeft+HOLE_WIDTH;
    let safe=false;
    if(holeRight<=SCREEN_WIDTH){ safe=(blockLeft>=holeLeft && blockRight<=holeRight);}
    else { const right=blockLeft>=holeLeft && blockRight<=SCREEN_WIDTH;
           const left=blockLeft>=0 && blockRight<=holeRight-SCREEN_WIDTH;
           safe=right||left; }
    barFlashColor=safe?"#00FF00":"#FF0000";
    setTimeout(()=>{barFlashColor=WHITE;},200);
}

// ---- UPDATE ----
function update(){
    if(state!=="playing") return;

    if(difficulty==="glutton"){
        if(!topKeyHeld) topBarX-=SLIDE_SPEED;
        if(!bottomKeyHeld) bottomBarX+=SLIDE_SPEED;

        spawnTimer--;
        if(spawnTimer<=0){ spawnBlock(true); spawnBlock(false); spawnTimer=SPAWN_INTERVAL_FRAMES; }

        for(let i=blocks.length-1;i>=0;i--){
            const block=blocks[i]; block.update();
            let fail=false;

            if(block.fromTop && block.y+block.height>=SCREEN_HEIGHT-BAR_HEIGHT*1.5){
                if(!blockPassesHole(block,bottomBarX)) fail=true;
            }
            if(!block.fromTop && block.y<=BAR_HEIGHT/2){
                if(!blockPassesHole(block,topBarX)) fail=true;
            }

            if(fail) state="game_over";
            if(block.fromTop && block.y>SCREEN_HEIGHT) blocks.splice(i,1);
            if(!block.fromTop && block.y+block.height<0) blocks.splice(i,1);
        }

    } else {
        if(!mouseDown) holeX-=SLIDE_SPEED;
        spawnTimer--; if(spawnTimer<=0){ spawnBlock(true); spawnTimer=SPAWN_INTERVAL_FRAMES; }
        for(let i=blocks.length-1;i>=0;i--){
            const block=blocks[i]; block.update();

            if(!block.scored && block.y>SCREEN_HEIGHT-BAR_HEIGHT){
                if(blockPassesHole(block,holeX)){ block.scored=true; score++; updateFallSpeed();}
            }
            if(block.y+block.height>SCREEN_HEIGHT-BAR_HEIGHT && block.y<SCREEN_HEIGHT){
                if(!blockPassesHole(block,holeX)){ state="game_over"; break; }
            }
            if(block.y>SCREEN_HEIGHT) blocks.splice(i,1);
        }
    }
}

// ---- DRAW ----
function draw(){
    ctx.fillStyle=BLACK; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

    if(difficulty==="glutton"){
        ctx.fillStyle=WHITE; ctx.fillRect(0,BAR_HEIGHT,SCREEN_WIDTH,BAR_HEIGHT/2);
        ctx.fillStyle=BLACK; ctx.fillRect(topBarX,BAR_HEIGHT,HOLE_WIDTH,BAR_HEIGHT/2);
        if(topBarX+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(topBarX-SCREEN_WIDTH,BAR_HEIGHT,HOLE_WIDTH,BAR_HEIGHT/2);

        ctx.fillStyle=WHITE; ctx.fillRect(0,SCREEN_HEIGHT-BAR_HEIGHT*1.5,SCREEN_WIDTH,BAR_HEIGHT/2);
        ctx.fillStyle=BLACK; ctx.fillRect(bottomBarX,SCREEN_HEIGHT-BAR_HEIGHT*1.5,HOLE_WIDTH,BAR_HEIGHT/2);
        if(bottomBarX+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(bottomBarX-SCREEN_WIDTH,SCREEN_HEIGHT-BAR_HEIGHT*1.5,HOLE_WIDTH,BAR_HEIGHT/2);
    } else {
        ctx.fillStyle=barFlashColor;
        ctx.fillRect(0,SCREEN_HEIGHT-BAR_HEIGHT,SCREEN_WIDTH,BAR_HEIGHT);
        const left=getHoleLeft(); ctx.fillStyle=BLACK; ctx.fillRect(left,SCREEN_HEIGHT-BAR_HEIGHT,HOLE_WIDTH,BAR_HEIGHT);
        if(left+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(left-SCREEN_WIDTH,SCREEN_HEIGHT-BAR_HEIGHT,HOLE_WIDTH,BAR_HEIGHT);
    }

    blocks.forEach(block=>block.draw());

    ctx.fillStyle=WHITE; ctx.font="48px Arial"; ctx.textAlign="start";
    ctx.fillText(score,30,100);
    ctx.font="32px Arial"; ctx.fillText("High Score: "+highScore,30,140);

    if(state==="game_over"){
        ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
        ctx.fillStyle="#FF5050"; ctx.font="48px Arial"; ctx.textAlign="center";
        ctx.fillText("GAME OVER",SCREEN_WIDTH/2,SCREEN_HEIGHT/2-40);
        ctx.fillStyle=WHITE; ctx.font="32px Arial"; ctx.fillText(score,SCREEN_WIDTH/2,SCREEN_HEIGHT/2);
        ctx.font="24px Arial"; ctx.fillText("Tap / Click / Press Key To Restart",SCREEN_WIDTH/2,SCREEN_HEIGHT/2+60);
        if(score>highScore){ highScore=score; localStorage.setItem('brakeDownHighScore',highScore);}
    }
}

// ---- MAIN LOOP ----
function loop(){ update(); draw(); requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
