<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brake Down - HTML5 Version</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: none; background: black; }
  #menu {
    text-align: center;
  }
  button {
    display: block;
    margin: 10px auto;
    padding: 12px 30px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  #scoreboard { font-size: 28px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="menu">
  <div id="scoreboard"></div>
  <button id="hardBtn">Hard</button>
  <button id="harderBtn">Harder</button>
  <button id="gluttonBtn">I'm a Glutton for Punishment</button>
</div>

<canvas id="gameCanvas" width="375" height="812"></canvas>

<script>
// --- BASELINE HARD/HARDER GAME ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;

const BLACK = "#000";
const WHITE = "#fff";

const BLOCK_COLORS = ["#FF6464","#FFA500","#FFFF00","#64FF64","#00C8FF","#6464FF","#C800FF","#FF3296"];
const NUM_COLUMNS = BLOCK_COLORS.length;
const COLUMN_WIDTH = SCREEN_WIDTH / NUM_COLUMNS;

const BAR_Y = SCREEN_HEIGHT - 170;
const BAR_HEIGHT = 60;
const HOLE_WIDTH = 80;
const HOLE_HEIGHT = BAR_HEIGHT;

const SLIDE_SPEED = 4.5;
const SPAWN_INTERVAL_FRAMES = 165;

const NORMAL_WIDTH = Math.floor(HOLE_WIDTH*0.45);
const WIDE_WIDTH = Math.floor(HOLE_WIDTH*0.9);

const INITIAL_FALL_SPEED = 2.2;
const FALL_SPEED_INCREASE = 0.3;
const MAX_LEVELS = 5;
const SCORE_INTERVAL = 20;

let score = 0;
let highScore = parseInt(localStorage.getItem('brakeDownHighScore')) || 0;
let blocks = [];
let spawnTimer = SPAWN_INTERVAL_FRAMES;
let fallSpeed = INITIAL_FALL_SPEED;
let blockCount = 0;
let holeX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let state = "menu";
let mouseDown = false;
let difficulty = "harder"; // default
let barFlashColor = WHITE;

// --- MENU ---
const menuDiv = document.getElementById('menu');
const scoreboard = document.getElementById('scoreboard');
scoreboard.innerText = "High Score: " + highScore;

document.getElementById('hardBtn').onclick = () => startGame('hard');
document.getElementById('harderBtn').onclick = () => startGame('harder');
document.getElementById('gluttonBtn').onclick = () => startGame('glutton');

function startGame(level) {
    difficulty = level;
    menuDiv.style.display = "none";
    canvas.style.display = "block";
    if(level === "glutton") startGluttonGame();
    else resetGame();
}

// --- INPUT ---
canvas.addEventListener('mousedown', () => { 
    if (state === "game_over") resetGame();
    mouseDown = true;                
    if (difficulty === "hard") predictBarFlash();
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', (e) => { 
    e.preventDefault();
    if (state === "game_over") resetGame();
    mouseDown = true;                
    if (difficulty === "hard") predictBarFlash();
});
canvas.addEventListener('touchend', (e) => { 
    e.preventDefault(); 
    mouseDown = false; 
});

// --- BLOCK CLASS ---
class Block {
    constructor(x, fallSpeed, width) {
        this.x = x; this.y = -HOLE_HEIGHT;
        this.width = width; this.height = HOLE_HEIGHT;
        this.fallSpeed = fallSpeed;
        this.column = Math.floor(x/COLUMN_WIDTH)%NUM_COLUMNS;
        this.baseColor = BLOCK_COLORS[this.column];
        this.color = this.baseColor;
        this.scored = false;
        this.isWide = (width>NORMAL_WIDTH);
    }
    update() {
        this.y += this.fallSpeed;
        if(this.isWide && score>=50){
            const t = performance.now()/1000; const pos = t%1.0;
            if(pos<0.4) this.color=this.baseColor;
            else if(pos<0.5) this.color=WHITE;
            else if(pos<0.9) this.color=this.baseColor;
            else this.color=BLACK;
        }else this.color=this.baseColor;
    }
    draw(){ ctx.fillStyle=this.color; ctx.fillRect(this.x,this.y,this.width,this.height);}
}

// --- BASELINE FUNCTIONS ---
function spawnBlock(){
    blockCount++;
    const isWide = (blockCount%5===0);
    const w = isWide? WIDE_WIDTH:NORMAL_WIDTH;
    const x = Math.random()*(SCREEN_WIDTH-w);
    blocks.push(new Block(x,fallSpeed,w));
}

function getHoleLeft(){
    let left = holeX % SCREEN_WIDTH; if(left<0) left+=SCREEN_WIDTH; return left;
}

function blockPassesHole(block){
    const left=getHoleLeft();
    const right=left+HOLE_WIDTH;
    const blockRight=block.x+block.width;
    if(right<=SCREEN_WIDTH) return block.x>=left && blockRight<=right;
    return (block.x>=left)||(blockRight<=right-SCREEN_WIDTH);
}

function updateFallSpeed(){
    const level = Math.min(Math.floor(score/SCORE_INTERVAL),MAX_LEVELS);
    fallSpeed = INITIAL_FALL_SPEED + level*FALL_SPEED_INCREASE;
}

function resetGame(){
    state="playing"; score=0; holeX=SCREEN_WIDTH/2 - HOLE_WIDTH/2;
    blocks=[]; spawnTimer=SPAWN_INTERVAL_FRAMES; fallSpeed=INITIAL_FALL_SPEED; blockCount=0;
    barFlashColor=WHITE;
}

// --- HARD DIFFICULTY FLASH ---
function getClosestBlockAboveBar(){
    let closest = null;
    let minDistance = Infinity;
    blocks.forEach(block => {
        if(block.y + block.height < BAR_Y){
            const dist = BAR_Y - (block.y + block.height);
            if(dist < minDistance){
                minDistance = dist;
                closest = block;
            }
        }
    });
    return closest;
}

function predictBarFlash() {
    const block = getClosestBlockAboveBar();
    if (!block) return;

    const blockLeft = block.x;
    const blockRight = block.x + block.width;

    let holeLeft = getHoleLeft();
    let holeRight = holeLeft + HOLE_WIDTH;

    let safe = false;

    if (holeRight <= SCREEN_WIDTH) safe = (blockLeft >= holeLeft && blockRight <= holeRight);
    else {
        const rightSegmentFits = blockLeft >= holeLeft && blockRight <= SCREEN_WIDTH;
        const leftSegmentFits = blockLeft >= 0 && blockRight <= (holeRight - SCREEN_WIDTH);
        safe = rightSegmentFits || leftSegmentFits;
    }

    barFlashColor = safe ? "#00FF00" : "#FF0000";
    setTimeout(()=>{ barFlashColor = WHITE; }, 200);
}

// --- BASELINE UPDATE ---
function update(){
    if(state!=="playing") return;
    if(!mouseDown) holeX-=SLIDE_SPEED;
    spawnTimer--; if(spawnTimer<=0){spawnBlock(); spawnTimer=SPAWN_INTERVAL_FRAMES;}
    for(let i=blocks.length-1;i>=0;i--){
        const block=blocks[i]; block.update();
        if(!block.scored && block.y>BAR_Y+BAR_HEIGHT){
            if(blockPassesHole(block)){ block.scored=true; score++; updateFallSpeed(); }
        }
        if(block.y+block.height>BAR_Y && block.y<BAR_Y+BAR_HEIGHT){
            if(!blockPassesHole(block)){
                state="game_over";
                if(score>highScore){ highScore=score; localStorage.setItem('brakeDownHighScore',highScore); scoreboard.innerText="High Score: "+highScore;}
                break;
            }
        }
        if(block.y>SCREEN_HEIGHT) blocks.splice(i,1);
    }
}

// --- BASELINE DRAW ---
function draw(){
    ctx.fillStyle=BLACK; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
    // Draw bar and hole
    ctx.fillStyle=barFlashColor;
    ctx.fillRect(0,BAR_Y,SCREEN_WIDTH,BAR_HEIGHT);
    const left=getHoleLeft();
    ctx.fillStyle=BLACK;
    ctx.fillRect(left,BAR_Y,HOLE_WIDTH,BAR_HEIGHT);
    if(left+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(left-SCREEN_WIDTH,BAR_Y,HOLE_WIDTH,BAR_HEIGHT);
    // Draw blocks
    blocks.forEach(block=>block.draw());
    // Score
    ctx.fillStyle=WHITE; ctx.font="48px Arial"; ctx.textAlign="start";
    ctx.fillText(score,30,100);
    ctx.font="32px Arial";
    ctx.fillText("High Score: "+highScore,30,140);
    if(state==="game_over"){
        ctx.fillStyle="rgba(0,0,0,0.55)";
        ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
        ctx.fillStyle="#FF5050"; ctx.font="48px Arial"; ctx.textAlign="center";
        ctx.fillText("GAME OVER",SCREEN_WIDTH/2,SCREEN_HEIGHT/2-40);
        ctx.fillStyle=WHITE; ctx.font="32px Arial";
        ctx.fillText(score,SCREEN_WIDTH/2,SCREEN_HEIGHT/2);
        ctx.font="24px Arial"; ctx.fillText("Tap / Click To Restart",SCREEN_WIDTH/2,SCREEN_HEIGHT/2+60);
    }
}

// --- GLUTTON MODE ---
function startGluttonGame(){
    // Clear variables
    state = "playing";
    score = 0;
    blocks = [];
    spawnTimer = SPAWN_INTERVAL_FRAMES;
    blockCount = 0;

    const GLUTTON_BAR_HEIGHT = BAR_HEIGHT/2;
    const GAP_BETWEEN_BARS = BAR_HEIGHT;
    const TOP_BAR_Y = SCREEN_HEIGHT/2 - GLUTTON_BAR_HEIGHT - GAP_BETWEEN_BARS/2;
    const BOTTOM_BAR_Y = SCREEN_HEIGHT/2 + GAP_BETWEEN_BARS/2;
    let topHoleX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
    let bottomHoleX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
    let topPaused = false;
    let bottomPaused = false;
    let gluttonBlocks = [];

    class GluttonBlock {
        constructor(x, speed, width, fromTop){
            this.x = x; this.width = width; this.height = HOLE_HEIGHT;
            this.fromTop = fromTop;
            this.y = fromTop ? -HOLE_HEIGHT : SCREEN_HEIGHT;
            this.speed = speed;
            this.color = BLOCK_COLORS[Math.floor(Math.random()*BLOCK_COLORS.length)];
            this.scored = false;
        }
        update(){ this.y += this.fromTop ? this.speed : -this.speed; }
        draw(){ ctx.fillStyle=this.color; ctx.fillRect(this.x,this.y,this.width,this.height); }
    }

    const keysDown = {};

    window.addEventListener('keydown', e => {
        if(e.key === 'w' || e.key === 'ArrowUp') keysDown['top']=true;
        if(e.key === 's' || e.key === 'ArrowDown') keysDown['bottom']=true;
    });
    window.addEventListener('keyup', e => {
        if(e.key === 'w' || e.key === 'ArrowUp') keysDown['top']=false;
        if(e.key === 's' || e.key === 'ArrowDown') keysDown['bottom']=false;
    });

    function spawnGluttonBlock(){
        blockCount++;
        const isWide = (blockCount%5===0);
        const w = isWide? WIDE_WIDTH:NORMAL_WIDTH;
        const x = Math.random()*(SCREEN_WIDTH-w);
        gluttonBlocks.push(new GluttonBlock(x, INITIAL_FALL_SPEED, w, true));
        const x2 = Math.random()*(SCREEN_WIDTH-w);
        gluttonBlocks.push(new GluttonBlock(x2, INITIAL_FALL_SPEED, w, false));
    }

    function updateGlutton(){
        if(state!=="playing") return;
        // Move bars if not paused
        if(!keysDown['top']) topHoleX -= SLIDE_SPEED;
        if(!keysDown['bottom']) bottomHoleX += SLIDE_SPEED;

        spawnTimer--; if(spawnTimer<=0){ spawnGluttonBlock(); spawnTimer=SPAWN_INTERVAL_FRAMES; }

        for(let i=gluttonBlocks.length-1;i>=0;i--){
            const block=gluttonBlocks[i]; block.update();

            const topLeft = topHoleX % SCREEN_WIDTH; if(topLeft<0) topLeft+=SCREEN_WIDTH; const topRight = topLeft+HOLE_WIDTH;
            const bottomLeft = bottomHoleX % SCREEN_WIDTH; if(bottomLeft<0) bottomLeft+=SCREEN_WIDTH; const bottomRight = bottomLeft+HOLE_WIDTH;

            // Check scoring
            if(!block.scored){
                if(block.fromTop && block.y + block.height > TOP_BAR_Y + GLUTTON_BAR_HEIGHT){
                    if(block.x >= topLeft && block.x+block.width <= topRight){
                        block.scored = 'top';
                    } else { state="game_over"; break; }
                }
                if(!block.fromTop && block.y < BOTTOM_BAR_Y){
                    if(block.x >= bottomLeft && block.x+block.width <= bottomRight){
                        block.scored = 'bottom';
                    } else { state="game_over"; break; }
                }
                // If block passed both
                if(block.scored === 'top' && !block.fromTop && block.y < BOTTOM_BAR_Y){
                    score++; updateFallSpeed(); gluttonBlocks.splice(i,1);
                }
            }

            // Remove out-of-screen blocks
            if(block.fromTop && block.y>SCREEN_HEIGHT) gluttonBlocks.splice(i,1);
            if(!block.fromTop && block.y<0) gluttonBlocks.splice(i,1);
        }
    }

    function drawGlutton(){
        ctx.fillStyle=BLACK; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

        // Draw top bar
        ctx.fillStyle=WHITE;
        ctx.fillRect(0, TOP_BAR_Y, SCREEN_WIDTH, GLUTTON_BAR_HEIGHT);
        const topLeft = topHoleX % SCREEN_WIDTH; if(topLeft<0) topLeft+=SCREEN_WIDTH;
        ctx.fillStyle=BLACK;
        ctx.fillRect(topLeft, TOP_BAR_Y, HOLE_WIDTH, GLUTTON_BAR_HEIGHT);
        if(topLeft+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(topLeft-SCREEN_WIDTH, TOP_BAR_Y, HOLE_WIDTH, GLUTTON_BAR_HEIGHT);

        // Draw bottom bar
        ctx.fillStyle=WHITE;
        ctx.fillRect(0, BOTTOM_BAR_Y, SCREEN_WIDTH, GLUTTON_BAR_HEIGHT);
        const bottomLeft = bottomHoleX % SCREEN_WIDTH; if(bottomLeft<0) bottomLeft+=SCREEN_WIDTH;
        ctx.fillStyle=BLACK;
        ctx.fillRect(bottomLeft, BOTTOM_BAR_Y, HOLE_WIDTH, GLUTTON_BAR_HEIGHT);
        if(bottomLeft+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(bottomLeft-SCREEN_WIDTH, BOTTOM_BAR_Y, HOLE_WIDTH, GLUTTON_BAR_HEIGHT);

        // Draw blocks
        gluttonBlocks.forEach(block=>block.draw());

        // Draw score
        ctx.fillStyle=WHITE; ctx.font="48px Arial"; ctx.textAlign="start";
        ctx.fillText(score,30,100);
        ctx.font="32px Arial";
        ctx.fillText("High Score: "+highScore,30,140);

        if(state==="game_over"){
            ctx.fillStyle="rgba(0,0,0,0.55)";
            ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
            ctx.fillStyle="#FF5050"; ctx.font="48px Arial"; ctx.textAlign="center";
            ctx.fillText("GAME OVER",SCREEN_WIDTH/2,SCREEN_HEIGHT/2-40);
            ctx.fillStyle=WHITE; ctx.font="32px Arial";
            ctx.fillText(score,SCREEN_WIDTH/2,SCREEN_HEIGHT/2);
            ctx.font="24px Arial"; ctx.fillText("Press Any Key To Restart",SCREEN_WIDTH/2,SCREEN_HEIGHT/2+60);
        }
    }

    function gluttonLoop(){
        updateGlutton();
        drawGlutton();
        requestAnimationFrame(gluttonLoop);
    }
    gluttonLoop();
}

// --- MAIN LOOP ---
function loop(){ update(); draw(); requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
