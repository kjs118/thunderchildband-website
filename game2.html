<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brake Down - HTML5 Version</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: none; background: black; }
  #menu {
    text-align: center;
  }
  button {
    display: block;
    margin: 10px auto;
    padding: 12px 30px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  #scoreboard { font-size: 28px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="menu">
  <div id="scoreboard"></div>
  <button id="hardBtn">Hard</button>
  <button id="harderBtn">Harder</button>
  <button id="gluttonBtn">I'm a Glutton for Punishment</button>
</div>

<canvas id="gameCanvas" width="375" height="812"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;

const BLACK = "#000";
const WHITE = "#fff";

const BLOCK_COLORS = ["#FF6464","#FFA500","#FFFF00","#64FF64","#00C8FF","#6464FF","#C800FF","#FF3296"];
const NUM_COLUMNS = BLOCK_COLORS.length;
const COLUMN_WIDTH = SCREEN_WIDTH / NUM_COLUMNS;

const BAR_Y = SCREEN_HEIGHT - 170;
const BAR_HEIGHT = 60;
const HOLE_WIDTH = 80;
const HOLE_HEIGHT = BAR_HEIGHT;

const SLIDE_SPEED = 4.5;
const SPAWN_INTERVAL_FRAMES = 165;

const NORMAL_WIDTH = Math.floor(HOLE_WIDTH*0.45);
const WIDE_WIDTH = Math.floor(HOLE_WIDTH*0.9);

const INITIAL_FALL_SPEED = 2.2;
const FALL_SPEED_INCREASE = 0.3;
const MAX_LEVELS = 5;
const SCORE_INTERVAL = 20;

// Hard & Harder variables
let score = 0;
let highScore = parseInt(localStorage.getItem('brakeDownHighScore')) || 0;
let blocks = [];
let spawnTimer = SPAWN_INTERVAL_FRAMES;
let fallSpeed = INITIAL_FALL_SPEED;
let blockCount = 0;
let holeX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let state = "menu";
let mouseDown = false;
let difficulty = "harder"; // default
let barFlashColor = WHITE;

// ---- MENU ----
const menuDiv = document.getElementById('menu');
const scoreboard = document.getElementById('scoreboard');
scoreboard.innerText = "High Score: " + highScore;

document.getElementById('hardBtn').onclick = () => startGame('hard');
document.getElementById('harderBtn').onclick = () => startGame('harder');
document.getElementById('gluttonBtn').onclick = () => startGame('glutton');

function startGame(level) {
    difficulty = level;
    menuDiv.style.display = "none";
    canvas.style.display = "block";
    if(level === 'glutton') initGlutton();
    else resetGame();
}

// ---- INPUT ----
canvas.addEventListener('mousedown', () => { 
    if (state === "game_over") difficulty === 'glutton' ? initGlutton() : resetGame();
    mouseDown = true;                
    if (difficulty === "hard") predictBarFlash();
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', (e) => { 
    e.preventDefault();
    if (state === "game_over") difficulty === 'glutton' ? initGlutton() : resetGame();
    mouseDown = true;                
    if (difficulty === "hard") predictBarFlash();
});
canvas.addEventListener('touchend', (e) => { 
    e.preventDefault(); 
    mouseDown = false; 
});
document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

// ------------------- BLOCK CLASS -------------------
class Block {
    constructor(x, y, fallSpeed, width, fromTop=true) {
        this.x = x; 
        this.y = y;
        this.width = width; 
        this.height = HOLE_HEIGHT;
        this.fallSpeed = fallSpeed;
        this.fromTop = fromTop; // top -> down, bottom -> up
        this.column = Math.floor(x/COLUMN_WIDTH)%NUM_COLUMNS;
        this.baseColor = BLOCK_COLORS[this.column];
        this.color = this.baseColor;
        this.scored = false;
        this.isWide = (width>NORMAL_WIDTH);
    }
    update(){
        this.y += this.fromTop ? this.fallSpeed : -this.fallSpeed;
        if(this.isWide && score>=50){
            const t = performance.now()/1000; const pos = t%1.0;
            if(pos<0.4) this.color=this.baseColor;
            else if(pos<0.5) this.color=WHITE;
            else if(pos<0.9) this.color=this.baseColor;
            else this.color=BLACK;
        } else this.color=this.baseColor;
    }
    draw(){ ctx.fillStyle=this.color; ctx.fillRect(this.x,this.y,this.width,this.height);}
}

// ------------------- HARD & HARDER FUNCTIONS -------------------
function spawnBlock(){
    blockCount++;
    const isWide = (blockCount%5===0);
    const w = isWide? WIDE_WIDTH:NORMAL_WIDTH;
    const x = Math.random()*(SCREEN_WIDTH-w);
    blocks.push(new Block(x,-HOLE_HEIGHT,fallSpeed,w,true));
}
function getHoleLeft(){ let left = holeX % SCREEN_WIDTH; if(left<0) left+=SCREEN_WIDTH; return left; }
function blockPassesHole(block){
    const left=getHoleLeft();
    const right=left+HOLE_WIDTH;
    const blockRight=block.x+block.width;
    if(right<=SCREEN_WIDTH) return block.x>=left && blockRight<=right;
    return (block.x>=left)||(blockRight<=right-SCREEN_WIDTH);
}
function updateFallSpeed(){
    const level = Math.min(Math.floor(score/SCORE_INTERVAL),MAX_LEVELS);
    fallSpeed = INITIAL_FALL_SPEED + level*FALL_SPEED_INCREASE;
}
function resetGame(){
    state="playing"; score=0; holeX=SCREEN_WIDTH/2 - HOLE_WIDTH/2;
    blocks=[]; spawnTimer=SPAWN_INTERVAL_FRAMES; fallSpeed=INITIAL_FALL_SPEED; blockCount=0;
    barFlashColor=WHITE;
}

// Hard difficulty flash
function getClosestBlockAboveBar(){
    let closest = null;
    let minDistance = Infinity;
    blocks.forEach(block => {
        if(block.y + block.height < BAR_Y){
            const dist = BAR_Y - (block.y + block.height);
            if(dist < minDistance){
                minDistance = dist;
                closest = block;
            }
        }
    });
    return closest;
}
function predictBarFlash() {
    const block = getClosestBlockAboveBar();
    if(!block) return;
    const blockLeft = block.x, blockRight = block.x+block.width;
    let holeLeft = getHoleLeft(), holeRight = holeLeft + HOLE_WIDTH;
    let safe = false;
    if(holeRight<=SCREEN_WIDTH) safe = (blockLeft>=holeLeft && blockRight<=holeRight);
    else safe = ((blockLeft>=holeLeft && blockRight<=SCREEN_WIDTH)||(blockLeft>=0 && blockRight<=holeRight-SCREEN_WIDTH));
    barFlashColor = safe?"#00FF00":"#FF0000";
    setTimeout(()=>{ barFlashColor=WHITE; },200);
}

// ------------------- GLUTTON MODE -------------------
let topBarX, bottomBarX;
let topBarSpeed = 2.5, bottomBarSpeed = 2.5;
let topHoleX, bottomHoleX;
let gluttonBlocks = [];
let gluttonSpawnTimer = 100;
let gluttonScore = 0;
let topBarHold = false;
let bottomBarHold = false;

function initGlutton(){
    // reset variables
    state = "playing";
    gluttonBlocks = [];
    gluttonSpawnTimer = 100;
    gluttonScore = 0;

    topBarX = 0; bottomBarX = 0;
    topHoleX = Math.random()*(SCREEN_WIDTH-HOLE_WIDTH);
    bottomHoleX = Math.random()*(SCREEN_WIDTH-HOLE_WIDTH);
    topBarHold = false; bottomBarHold = false;

    blocks = []; // just to clear
}

// Keyboard controls
function handleKeyDown(e){
    if(state!=="playing") return;
    if(difficulty !== 'glutton') return;
    if(e.key === "w" || e.key === "ArrowUp") topBarHold = true;
    if(e.key === "s" || e.key === "ArrowDown") bottomBarHold = true;
}
function handleKeyUp(e){
    if(difficulty !== 'glutton') return;
    if(e.key === "w" || e.key === "ArrowUp") topBarHold = false;
    if(e.key === "s" || e.key === "ArrowDown") bottomBarHold = false;
}

// Glutton block spawn
function spawnGluttonBlock(){
    const x = Math.random()*(SCREEN_WIDTH-NORMAL_WIDTH);
    // top
    gluttonBlocks.push(new Block(x,-HOLE_HEIGHT,INITIAL_FALL_SPEED,true));
    // bottom
    const y = SCREEN_HEIGHT + HOLE_HEIGHT;
    gluttonBlocks.push(new Block(x,y,INITIAL_FALL_SPEED,NORMAL_WIDTH,false));
}

// Glutton update
function updateGlutton(){
    if(state!=="playing") return;

    // move bars unless held
    if(!topBarHold){ topBarX+=topBarSpeed; if(topBarX>SCREEN_WIDTH) topBarX-=SCREEN_WIDTH; }
    if(!bottomBarHold){ bottomBarX-=bottomBarSpeed; if(bottomBarX<-SCREEN_WIDTH) bottomBarX+=SCREEN_WIDTH; }

    // spawn blocks staggered
    gluttonSpawnTimer--;
    if(gluttonSpawnTimer<=0){
        spawnGluttonBlock();
        gluttonSpawnTimer = 100; // adjust for pacing
    }

    // update blocks
    for(let i=gluttonBlocks.length-1;i>=0;i--){
        const b = gluttonBlocks[i];
        b.update();

        // check collision
        if(b.fromTop){
            const topBarY = SCREEN_HEIGHT/2 - BAR_HEIGHT/2 - BAR_HEIGHT/2; // upper bar half-height
            const left = topBarX % SCREEN_WIDTH;
            const right = left+HOLE_WIDTH;
            const blockRight = b.x + b.width;
            if(b.y+b.height>topBarY && b.y<topBarY + BAR_HEIGHT/2){
                let safe = (blockRight>left && b.x<right) ? false : true;
                if(!safe){ state="game_over"; break; }
            }
            if(b.y>SCREEN_HEIGHT) gluttonBlocks.splice(i,1);
        } else {
            const bottomBarY = SCREEN_HEIGHT/2 + BAR_HEIGHT/2; // bottom bar
            const left = bottomBarX % SCREEN_WIDTH;
            const right = left+HOLE_WIDTH;
            const blockRight = b.x + b.width;
            if(b.y<b.height+bottomBarY && b.y>bottomBarY - BAR_HEIGHT/2){
                let safe = (blockRight>left && b.x<right) ? false : true;
                if(!safe){ state="game_over"; break; }
            }
            if(b.y<0) gluttonBlocks.splice(i,1);
        }
    }
}

// Glutton draw
function drawGlutton(){
    ctx.fillStyle=BLACK; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

    // draw top bar
    const topBarY = SCREEN_HEIGHT/2 - BAR_HEIGHT; 
    ctx.fillStyle=WHITE;
    ctx.fillRect(topBarX, topBarY, SCREEN_WIDTH, BAR_HEIGHT/2);
    ctx.fillStyle=BLACK;
    ctx.fillRect(topHoleX, topBarY, HOLE_WIDTH, BAR_HEIGHT/2);
    if(topHoleX + HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(topHoleX-SCREEN_WIDTH, topBarY, HOLE_WIDTH, BAR_HEIGHT/2);

    // draw bottom bar
    const bottomBarY = SCREEN_HEIGHT/2;
    ctx.fillStyle=WHITE;
    ctx.fillRect(bottomBarX, bottomBarY, SCREEN_WIDTH, BAR_HEIGHT/2);
    ctx.fillStyle=BLACK;
    ctx.fillRect(bottomHoleX, bottomBarY, HOLE_WIDTH, BAR_HEIGHT/2);
    if(bottomHoleX + HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(bottomHoleX-SCREEN_WIDTH, bottomBarY, HOLE_WIDTH, BAR_HEIGHT/2);

    // draw blocks
    gluttonBlocks.forEach(b=>b.draw());

    // score
    ctx.fillStyle=WHITE; ctx.font="48px Arial"; ctx.textAlign="start";
    ctx.fillText(gluttonScore,30,100);

    if(state==="game_over"){
        ctx.fillStyle="rgba(0,0,0,0.55)";
        ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

        ctx.fillStyle="#FF5050"; ctx.font="48px Arial"; ctx.textAlign="center";
        ctx.fillText("GAME OVER",SCREEN_WIDTH/2,SCREEN_HEIGHT/2-40);

        ctx.fillStyle=WHITE; ctx.font="32px Arial";
        ctx.fillText(gluttonScore,SCREEN_WIDTH/2,SCREEN_HEIGHT/2);

        ctx.font="24px Arial"; ctx.fillText("Press Any Key To Restart",SCREEN_WIDTH/2,SCREEN_HEIGHT/2+60);
    }
}

// ------------------- MAIN LOOP -------------------
function loop(){
    if(difficulty==='glutton') { updateGlutton(); drawGlutton(); }
    else { update(); draw(); }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
