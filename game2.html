<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glutton Mode</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
}
canvas {
  display: block;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
/* ======================
   CANVAS
====================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* ======================
   GAME CONSTANTS
====================== */
const BAR_HEIGHT = 14;
const HOLE_WIDTH = 80;
const BAR_SPEED = 2;

const BLOCK_SIZE = 14;
const BLOCK_SPEED = 3;
const SPAWN_RATE = 40;

/* ======================
   DYNAMIC CENTER (KEY FIX)
====================== */
function getCenterY() {
  return canvas.height / 2;
}

const BAR_SPACING = BAR_HEIGHT * 3;

/* ======================
   GAME STATE
====================== */
let running = true;
let score = 0;
let highScore = 0;

let bars = [];
let blocks = [];
let spawnTimer = 0;

/* ======================
   INIT / RESET
====================== */
function initBars() {
  const centerY = getCenterY();

  bars = [
    {
      y: centerY - BAR_SPACING,
      holeX: 0,
      dir: 1,
      paused: false
    },
    {
      y: centerY + BAR_SPACING,
      holeX: canvas.width - HOLE_WIDTH,
      dir: -1,
      paused: false
    }
  ];
}

function resetGame() {
  running = true;
  score = 0;
  blocks = [];
  spawnTimer = 0;
  initBars();
}

initBars();

/* ======================
   INPUT (MOBILE)
====================== */
canvas.addEventListener("pointerdown", e => {
  if (!running) {
    resetGame();
    return;
  }

  const y = e.clientY;

  if (y < bars[0].y) bars[0].paused = true;
  if (y > bars[1].y) bars[1].paused = true;
});

canvas.addEventListener("pointerup", () => {
  bars[0].paused = false;
  bars[1].paused = false;
});

/* ======================
   SPAWN
====================== */
function spawnBlock() {
  blocks.push({
    x: Math.random() * (canvas.width - BLOCK_SIZE),
    y: -BLOCK_SIZE
  });
}

/* ======================
   UPDATE
====================== */
function update() {
  if (!running) return;

  // Move bars
  bars.forEach(bar => {
    if (!bar.paused) {
      bar.holeX += BAR_SPEED * bar.dir;

      if (bar.holeX > canvas.width) bar.holeX = -HOLE_WIDTH;
      if (bar.holeX < -HOLE_WIDTH) bar.holeX = canvas.width;
    }
  });

  // Spawn blocks
  spawnTimer++;
  if (spawnTimer > SPAWN_RATE) {
    spawnTimer = 0;
    spawnBlock();
  }

  // Move blocks
  blocks.forEach(b => b.y += BLOCK_SPEED);

  // Collision
  blocks.forEach(b => {
    bars.forEach(bar => {
      if (
        b.y + BLOCK_SIZE > bar.y &&
        b.y < bar.y + BAR_HEIGHT
      ) {
        const safe =
          b.x + BLOCK_SIZE > bar.holeX &&
          b.x < bar.holeX + HOLE_WIDTH;

        if (!safe) running = false;
      }
    });
  });

  // Score
  blocks = blocks.filter(b => {
    if (b.y > canvas.height) {
      score++;
      highScore = Math.max(highScore, score);
      return false;
    }
    return true;
  });
}

/* ======================
   DRAW
====================== */
function drawBar(bar) {
  ctx.fillStyle = "white";
  ctx.fillRect(0, bar.y, bar.holeX, BAR_HEIGHT);
  ctx.fillRect(
    bar.holeX + HOLE_WIDTH,
    bar.y,
    canvas.width,
    BAR_HEIGHT
  );
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  bars.forEach(drawBar);

  ctx.fillStyle = "red";
  blocks.forEach(b =>
    ctx.fillRect(b.x, b.y, BLOCK_SIZE, BLOCK_SIZE)
  );

  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.textAlign = "left";
  ctx.fillText(`Score: ${score}`, 12, 26);
  ctx.fillText(`High: ${highScore}`, 12, 46);

  if (!running) {
    ctx.textAlign = "center";
    ctx.font = "24px Arial";
    ctx.fillText("GAME OVER",
      canvas.width / 2,
      canvas.height / 2 - 10
    );
    ctx.font = "16px Arial";
    ctx.fillText("Tap to Restart",
      canvas.width / 2,
      canvas.height / 2 + 20
    );
  }
}

/* ======================
   LOOP
====================== */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
