<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brake Down - HTML5 Version</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: none; background: black; }
  #menu {
    text-align: center;
  }
  button {
    display: block;
    margin: 10px auto;
    padding: 12px 30px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  #scoreboard { font-size: 28px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="menu">
  <div id="scoreboard"></div>
  <button id="hardBtn">Hard</button>
  <button id="harderBtn">Harder</button>
  <button id="gluttonBtn">I'm a Glutton for Punishment</button>
</div>

<canvas id="gameCanvas" width="375" height="812"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;

const BLACK = "#000";
const WHITE = "#fff";

const BLOCK_COLORS = ["#FF6464","#FFA500","#FFFF00","#64FF64","#00C8FF","#6464FF","#C800FF","#FF3296"];
const NUM_COLUMNS = BLOCK_COLORS.length;
const COLUMN_WIDTH = SCREEN_WIDTH / NUM_COLUMNS;

// === Hard/Harder Bar ===
const BAR_Y = SCREEN_HEIGHT - 170;
const BAR_HEIGHT = 60;
const HOLE_WIDTH = 80;
const HOLE_HEIGHT = BAR_HEIGHT;

// === Glutton Bar ===
let GLUTTON_BAR_HEIGHT = BAR_HEIGHT/4;
let GLUTTON_SPACE_BETWEEN = BAR_HEIGHT*2; // space between top/bottom bars

const SLIDE_SPEED = 4.5;
const SPAWN_INTERVAL_FRAMES = 165;

const NORMAL_WIDTH = Math.floor(HOLE_WIDTH*0.45);
const WIDE_WIDTH = Math.floor(HOLE_WIDTH*0.9);

const INITIAL_FALL_SPEED = 2.2;
const FALL_SPEED_INCREASE = 0.3;
const MAX_LEVELS = 5;
const SCORE_INTERVAL = 20;

let score = 0;
let highScore = parseInt(localStorage.getItem('brakeDownHighScore')) || 0;
let blocks = [];
let spawnTimer = SPAWN_INTERVAL_FRAMES;
let fallSpeed = INITIAL_FALL_SPEED;
let blockCount = 0;
let holeX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let state = "menu";
let mouseDown = false;
let difficulty = "harder"; // default
let barFlashColor = WHITE;

// Glutton mode variables
let gluttonTopX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let gluttonBottomX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
let gluttonTopPaused = false;
let gluttonBottomPaused = false;

// ---- MENU ----
const menuDiv = document.getElementById('menu');
const scoreboard = document.getElementById('scoreboard');
scoreboard.innerText = "High Score: " + highScore;

document.getElementById('hardBtn').onclick = () => startGame('hard');
document.getElementById('harderBtn').onclick = () => startGame('harder');
document.getElementById('gluttonBtn').onclick = () => startGame('glutton');

function startGame(level){
    difficulty = level;
    menuDiv.style.display = "none";
    canvas.style.display = "block";
    init();
}

// ---- INPUT ----
canvas.addEventListener('mousedown', () => { 
    if(state==="game_over") init();
    mouseDown = true;                
    if(difficulty === "hard") predictBarFlash();
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); if(state==="game_over") init(); mouseDown=true; if(difficulty==="hard") predictBarFlash(); });
canvas.addEventListener('touchend', e=>{ e.preventDefault(); mouseDown=false; });

// Glutton keyboard input
document.addEventListener('keydown', e=>{
    if(state==="game_over") { init(); return; }
    if(difficulty!=="glutton") return;
    if(e.key==="ArrowUp" || e.key==="w") gluttonTopPaused=true;
    if(e.key==="ArrowDown" || e.key==="s") gluttonBottomPaused=true;
});
document.addEventListener('keyup', e=>{
    if(difficulty!=="glutton") return;
    if(e.key==="ArrowUp" || e.key==="w") gluttonTopPaused=false;
    if(e.key==="ArrowDown" || e.key==="s") gluttonBottomPaused=false;
});

// ---- BLOCK CLASS ----
class Block {
    constructor(x, y, fallSpeed, width, fromTop=true){
        this.x = x; this.y = y;
        this.width = width; this.height = HOLE_HEIGHT;
        this.fallSpeed = fallSpeed;
        this.fromTop = fromTop; // true if falling from top, false if from bottom
        this.column = Math.floor(x/COLUMN_WIDTH)%NUM_COLUMNS;
        this.baseColor = BLOCK_COLORS[this.column];
        this.color = this.baseColor;
        this.scored = false;
    }
    update(){
        this.y += this.fallSpeed * (this.fromTop?1:-1);
    }
    draw(){ ctx.fillStyle=this.color; ctx.fillRect(this.x,this.y,this.width,this.height);}
}

// ---- FUNCTIONS ----
function spawnBlockGlutton(){
    const w = Math.random() < 0.2 ? WIDE_WIDTH : NORMAL_WIDTH;
    const topX = Math.random()*(SCREEN_WIDTH-w);
    const bottomX = Math.random()*(SCREEN_WIDTH-w);
    blocks.push(new Block(topX, -GLUTTON_BAR_HEIGHT, INITIAL_FALL_SPEED, w, true));
    blocks.push(new Block(bottomX, SCREEN_HEIGHT+GLUTTON_BAR_HEIGHT, INITIAL_FALL_SPEED, w, false));
}

function init(){
    // Reset variables
    score = 0; blocks=[]; spawnTimer=SPAWN_INTERVAL_FRAMES/2; blockCount=0;
    holeX = SCREEN_WIDTH/2 - HOLE_WIDTH/2; barFlashColor=WHITE;
    gluttonTopX = SCREEN_WIDTH/2 - HOLE_WIDTH/2; gluttonBottomX = SCREEN_WIDTH/2 - HOLE_WIDTH/2;
    gluttonTopPaused = false; gluttonBottomPaused=false;
    fallSpeed = INITIAL_FALL_SPEED;
    state="playing";
}

// ---- HARD DIFFICULTY FUNCTIONS ----
function getClosestBlockAboveBar(){
    let closest=null; let minDistance=Infinity;
    blocks.forEach(block=>{
        if(block.y+block.height<BAR_Y){
            const dist=BAR_Y-(block.y+block.height);
            if(dist<minDistance){ minDistance=dist; closest=block; }
        }
    });
    return closest;
}
function predictBarFlash(){
    const block=getClosestBlockAboveBar();
    if(!block) return;
    const blockLeft=block.x;
    const blockRight=block.x+block.width;
    let holeLeft = holeX; let holeRight = holeLeft+HOLE_WIDTH;
    let safe = false;
    if(holeRight <= SCREEN_WIDTH){
        safe=(blockLeft>=holeLeft && blockRight<=holeRight);
    } else {
        safe=((blockLeft>=holeLeft && blockRight<=SCREEN_WIDTH)||(blockLeft>=0 && blockRight<=holeRight-SCREEN_WIDTH));
    }
    barFlashColor = safe ? "#00FF00" : "#FF0000";
    setTimeout(()=>{barFlashColor=WHITE;},200);
}

// ---- UPDATE LOOP ----
function update(){
    if(state!=="playing") return;
    if(difficulty==="hard" || difficulty==="harder"){
        if(!mouseDown) holeX -= SLIDE_SPEED;
        spawnTimer--; if(spawnTimer<=0){ spawnBlock(); spawnTimer=SPAWN_INTERVAL_FRAMES; }
        for(let i=blocks.length-1;i>=0;i--){
            const block=blocks[i]; block.update();
            if(!block.scored && block.y>BAR_Y+BAR_HEIGHT){
                if(blockPassesHole(block)){ block.scored=true; score++; updateFallSpeed(); }
            }
            if(block.y+block.height>BAR_Y && block.y<BAR_Y+BAR_HEIGHT){
                if(!blockPassesHole(block)){
                    state="game_over";
                    if(score>highScore){ highScore=score; localStorage.setItem('brakeDownHighScore',highScore); scoreboard.innerText="High Score: "+highScore;}
                    break;
                }
            }
            if(block.y>SCREEN_HEIGHT) blocks.splice(i,1);
        }
    } else if(difficulty==="glutton"){
        // Move bars
        if(!gluttonTopPaused) gluttonTopX-=SLIDE_SPEED; 
        if(!gluttonBottomPaused) gluttonBottomX+=SLIDE_SPEED;

        // Wrap bars
        gluttonTopX=(gluttonTopX+SCREEN_WIDTH)%SCREEN_WIDTH;
        gluttonBottomX=(gluttonBottomX+SCREEN_WIDTH)%SCREEN_WIDTH;

        // Spawn blocks slower
        spawnTimer--; if(spawnTimer<=0){ spawnBlockGlutton(); spawnTimer=SPAWN_INTERVAL_FRAMES/2; }

        // Update blocks
        for(let i=blocks.length-1;i>=0;i--){
            const block=blocks[i]; block.update();
            const topHoleLeft=gluttonTopX; const topHoleRight=topHoleLeft+HOLE_WIDTH;
            const bottomHoleLeft=gluttonBottomX; const bottomHoleRight=bottomHoleLeft+HOLE_WIDTH;

            let topSafe=false, bottomSafe=false;
            if(block.fromTop){
                topSafe=(block.x>=topHoleLeft && block.x+block.width<=topHoleRight);
                bottomSafe=(block.x>=bottomHoleLeft && block.x+block.width<=bottomHoleRight);
            } else {
                bottomSafe=(block.x>=bottomHoleLeft && block.x+block.width<=bottomHoleRight);
                topSafe=(block.x>=topHoleLeft && block.x+block.width<=topHoleRight);
            }

            if(!topSafe || !bottomSafe){ state="game_over"; break; }

            if(block.fromTop && block.y>SCREEN_HEIGHT/2 && !block.scored){ block.scored=true; score++; }
            if(block.fromTop && block.y<-block.height) blocks.splice(i,1);
            if(!block.fromTop && block.y>SCREEN_HEIGHT+block.height) blocks.splice(i,1);
        }
    }
}

// ---- DRAW LOOP ----
function draw(){
    ctx.fillStyle=BLACK; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

    if(difficulty==="hard" || difficulty==="harder"){
        ctx.fillStyle=barFlashColor;
        ctx.fillRect(0,BAR_Y,SCREEN_WIDTH,BAR_HEIGHT);
        const left=holeX;
        ctx.fillStyle=BLACK;
        ctx.fillRect(left,BAR_Y,HOLE_WIDTH,BAR_HEIGHT);
        if(left+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(left-SCREEN_WIDTH,BAR_Y,HOLE_WIDTH,BAR_HEIGHT);
    } else if(difficulty==="glutton"){
        // Top bar
        ctx.fillStyle=WHITE;
        ctx.fillRect(0,SCREEN_HEIGHT/2-GLUTTON_SPACE_BETWEEN/2-GLUTTON_BAR_HEIGHT,SCREEN_WIDTH,GLUTTON_BAR_HEIGHT);
        ctx.fillStyle=BLACK;
        ctx.fillRect(gluttonTopX,SCREEN_HEIGHT/2-GLUTTON_SPACE_BETWEEN/2-GLUTTON_BAR_HEIGHT,HOLE_WIDTH,GLUTTON_BAR_HEIGHT);
        if(gluttonTopX+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(gluttonTopX-SCREEN_WIDTH,SCREEN_HEIGHT/2-GLUTTON_SPACE_BETWEEN/2-GLUTTON_BAR_HEIGHT,HOLE_WIDTH,GLUTTON_BAR_HEIGHT);

        // Bottom bar
        ctx.fillStyle=WHITE;
        ctx.fillRect(0,SCREEN_HEIGHT/2+GLUTTON_SPACE_BETWEEN/2,SCREEN_WIDTH,GLUTTON_BAR_HEIGHT);
        ctx.fillStyle=BLACK;
        ctx.fillRect(gluttonBottomX,SCREEN_HEIGHT/2+GLUTTON_SPACE_BETWEEN/2,HOLE_WIDTH,GLUTTON_BAR_HEIGHT);
        if(gluttonBottomX+HOLE_WIDTH>SCREEN_WIDTH) ctx.fillRect(gluttonBottomX-SCREEN_WIDTH,SCREEN_HEIGHT/2+GLUTTON_SPACE_BETWEEN/2,HOLE_WIDTH,GLUTTON_BAR_HEIGHT);
    }

    blocks.forEach(block=>block.draw());

    ctx.fillStyle=WHITE; ctx.font="48px Arial"; ctx.textAlign="start";
    ctx.fillText(score,30,100);
    ctx.font="32px Arial";
    ctx.fillText("High Score: "+highScore,30,140);

    if(state==="game_over"){
        ctx.fillStyle="rgba(0,0,0,0.55)";
        ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
        ctx.fillStyle="#FF5050"; ctx.font="48px Arial"; ctx.textAlign="center";
        ctx.fillText("GAME OVER",SCREEN_WIDTH/2,SCREEN_HEIGHT/2-40);
        ctx.fillStyle=WHITE; ctx.font="32px Arial";
        ctx.fillText(score,SCREEN_WIDTH/2,SCREEN_HEIGHT/2);
        ctx.font="24px Arial"; ctx.fillText("Press Any Key To Restart",SCREEN_WIDTH/2,SCREEN_HEIGHT/2+60);
    }
}

// ---- MAIN LOOP ----
function loop(){ update(); draw(); requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
