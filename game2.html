<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brake Down - HTML5 Version</title>
<style>
  body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: none; background: black; }
  #menu { text-align: center; }
  button {
    display: block;
    margin: 10px auto;
    padding: 12px 30px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  #scoreboard { font-size: 28px; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="menu">
  <div id="scoreboard"></div>
  <button id="hardBtn">Hard</button>
  <button id="harderBtn">Harder</button>
  <button id="gluttonBtn">I'm a Glutton for Punishment</button>
</div>

<canvas id="gameCanvas" width="375" height="812"></canvas>

<script>
/* ================= CORE SETUP ================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SCREEN_WIDTH = canvas.width;
const SCREEN_HEIGHT = canvas.height;

const BLACK = "#000";
const WHITE = "#fff";

const BAR_HEIGHT = 60;
const HOLE_WIDTH = 80;

const SLIDE_SPEED = 4.5;
const SPAWN_INTERVAL_FRAMES = 165;

const INITIAL_FALL_SPEED = 2.2;

let state = "menu";
let difficulty = "harder";
let score = 0;
let highScore = parseInt(localStorage.getItem('brakeDownHighScore')) || 0;

/* ================= MENU ================= */
const menuDiv = document.getElementById('menu');
const scoreboard = document.getElementById('scoreboard');
scoreboard.innerText = "High Score: " + highScore;

document.getElementById('hardBtn').onclick = () => startGame("hard");
document.getElementById('harderBtn').onclick = () => startGame("harder");
document.getElementById('gluttonBtn').onclick = () => startGame("glutton");

function startGame(mode){
  difficulty = mode;
  menuDiv.style.display = "none";
  canvas.style.display = "block";
  resetGame();
}

/* =====================================================
   =================== CLASSIC MODE ====================
   (Hard & Harder — UNCHANGED)
===================================================== */
let holeX = SCREEN_WIDTH / 2 - HOLE_WIDTH / 2;
let mouseDown = false;
let blocks = [];
let spawnTimer = SPAWN_INTERVAL_FRAMES;

class Block {
  constructor(x, y, speed) {
    this.x = x;
    this.y = y;
    this.width = HOLE_WIDTH * 0.45;
    this.height = BAR_HEIGHT;
    this.speed = speed;
    this.scored = false;
  }
  update(){ this.y += this.speed; }
  draw(){
    ctx.fillStyle = WHITE;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
}

function resetGame(){
  score = 0;
  state = "playing";
  blocks = [];
  spawnTimer = SPAWN_INTERVAL_FRAMES;

  if(difficulty !== "glutton"){
    holeX = SCREEN_WIDTH / 2 - HOLE_WIDTH / 2;
  } else {
    initGlutton();
  }
}

/* ================= INPUT ================= */
canvas.addEventListener("mousedown", e => handlePress(e));
canvas.addEventListener("mouseup", () => mouseDown = false);
canvas.addEventListener("touchstart", e => handlePress(e));
canvas.addEventListener("touchend", () => mouseDown = false);

function handlePress(e){
  if(state === "game_over"){ resetGame(); return; }

  if(difficulty !== "glutton"){
    mouseDown = true;
  } else {
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    if(y < SCREEN_HEIGHT / 2) gluttonHoldTop = true;
    else gluttonHoldBottom = true;
  }
}

/* =====================================================
   =================== GLUTTON MODE ====================
===================================================== */
let topBarX, bottomBarX;
let gluttonBlocks = [];
let gluttonHoldTop = false;
let gluttonHoldBottom = false;

const GAP_HEIGHT = BAR_HEIGHT;
const HALF_BAR = BAR_HEIGHT / 2;

const TOP_BAR_Y = SCREEN_HEIGHT / 2 - GAP_HEIGHT / 2 - HALF_BAR;
const BOTTOM_BAR_Y = SCREEN_HEIGHT / 2 + GAP_HEIGHT / 2;

function initGlutton(){
  topBarX = 0;
  bottomBarX = 0;
  gluttonBlocks = [];
  gluttonHoldTop = false;
  gluttonHoldBottom = false;
}

function spawnGluttonBlock(){
  const x = Math.random() * (SCREEN_WIDTH - 40);
  const fromTop = Math.random() < 0.5;
  gluttonBlocks.push({
    x,
    y: fromTop ? -40 : SCREEN_HEIGHT,
    dir: fromTop ? 1 : -1
  });
}

/* ================= UPDATE ================= */
function update(){
  if(state !== "playing") return;

  if(difficulty !== "glutton"){
    if(!mouseDown) holeX -= SLIDE_SPEED;
    spawnTimer--;
    if(spawnTimer <= 0){
      blocks.push(new Block(Math.random()*300, -60, INITIAL_FALL_SPEED));
      spawnTimer = SPAWN_INTERVAL_FRAMES;
    }
    blocks.forEach(b => b.update());
  } else {
    if(!gluttonHoldTop) topBarX -= SLIDE_SPEED;
    if(!gluttonHoldBottom) bottomBarX += SLIDE_SPEED;

    topBarX = (topBarX + SCREEN_WIDTH) % SCREEN_WIDTH;
    bottomBarX = bottomBarX % SCREEN_WIDTH;

    if(Math.random() < 0.02) spawnGluttonBlock();

    gluttonBlocks.forEach(b => b.y += b.dir * INITIAL_FALL_SPEED);
  }
}

/* ================= DRAW ================= */
function draw(){
  ctx.fillStyle = BLACK;
  ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

  if(difficulty !== "glutton"){
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, SCREEN_HEIGHT-170, SCREEN_WIDTH, BAR_HEIGHT);
  } else {
    ctx.fillStyle = WHITE;
    ctx.fillRect(topBarX, TOP_BAR_Y, SCREEN_WIDTH, HALF_BAR);
    ctx.fillRect(bottomBarX, BOTTOM_BAR_Y, SCREEN_WIDTH, HALF_BAR);

    gluttonBlocks.forEach(b=>{
      ctx.fillRect(b.x, b.y, 40, 40);
    });
  }

  ctx.fillStyle = WHITE;
  ctx.font = "40px Arial";
  ctx.fillText(score, 30, 80);
}

/* ================= LOOP ================= */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
