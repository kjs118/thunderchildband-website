<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glutton Mode</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100vw;
  height: 100svh; /* mobile-safe viewport */
  background: black;
}
</style>
</head>

<body>
<canvas id="gluttonCanvas"></canvas>

<script>
const canvas = document.getElementById("gluttonCanvas");
const ctx = canvas.getContext("2d");

let SCREEN_WIDTH, SCREEN_HEIGHT;

// ===== Resize Fix (Mobile Safe) =====
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  SCREEN_WIDTH = rect.width;
  SCREEN_HEIGHT = rect.height;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ===== Game State =====
let running = true;
let score = 0;
let highScore = 0;

// ===== Bars =====
const BAR_HEIGHT = 14;
const HOLE_WIDTH = 80;
const BAR_SPEED = 2;

const barGap = 120;
const centerY = SCREEN_HEIGHT / 2;

const bars = [
  {
    y: centerY - barGap / 2,
    holeX: 0,
    dir: 1,
    paused: false
  },
  {
    y: centerY + barGap / 2,
    holeX: SCREEN_WIDTH - HOLE_WIDTH,
    dir: -1,
    paused: false
  }
];

// ===== Blocks =====
const BLOCK_SIZE = 14;
const BLOCK_SPEED = 3;
let blocks = [];
let spawnTimer = 0;

// ===== Input =====
window.addEventListener("keydown", () => {
  if (!running) resetGame();
  else bars.forEach(b => b.paused = !b.paused);
});

canvas.addEventListener("pointerdown", e => {
  if (!running) {
    resetGame();
    return;
  }

  const y = e.clientY;
  if (y < bars[0].y) bars[0].paused = !bars[0].paused;
  else if (y > bars[1].y) bars[1].paused = !bars[1].paused;
});

// ===== Reset =====
function resetGame() {
  running = true;
  score = 0;
  blocks = [];
  spawnTimer = 0;

  bars[0].holeX = 0;
  bars[1].holeX = SCREEN_WIDTH - HOLE_WIDTH;
  bars[0].paused = false;
  bars[1].paused = false;
}

// ===== Spawn Blocks =====
function spawnBlock() {
  blocks.push({
    x: Math.random() * (SCREEN_WIDTH - BLOCK_SIZE),
    y: -BLOCK_SIZE
  });
}

// ===== Update =====
function update() {
  if (!running) return;

  // Move bars
  bars.forEach(bar => {
    if (!bar.paused) {
      bar.holeX += BAR_SPEED * bar.dir;
      if (bar.holeX > SCREEN_WIDTH) bar.holeX = -HOLE_WIDTH;
      if (bar.holeX < -HOLE_WIDTH) bar.holeX = SCREEN_WIDTH;
    }
  });

  // Spawn blocks
  spawnTimer++;
  if (spawnTimer > 40) {
    spawnTimer = 0;
    spawnBlock();
  }

  // Move blocks
  blocks.forEach(b => b.y += BLOCK_SPEED);

  // Collision
  blocks.forEach(block => {
    bars.forEach(bar => {
      if (
        block.y + BLOCK_SIZE > bar.y &&
        block.y < bar.y + BAR_HEIGHT
      ) {
        const inHole =
          block.x + BLOCK_SIZE > bar.holeX &&
          block.x < bar.holeX + HOLE_WIDTH;

        if (!inHole) running = false;
      }
    });
  });

  // Score
  blocks = blocks.filter(b => {
    if (b.y > SCREEN_HEIGHT) {
      score++;
      highScore = Math.max(score, highScore);
      return false;
    }
    return true;
  });
}

// ===== Draw =====
function drawBar(bar) {
  ctx.fillStyle = "white";
  ctx.fillRect(0, bar.y, bar.holeX, BAR_HEIGHT);
  ctx.fillRect(
    bar.holeX + HOLE_WIDTH,
    bar.y,
    SCREEN_WIDTH,
    BAR_HEIGHT
  );
}

function draw() {
  ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

  // Bars
  bars.forEach(drawBar);

  // Blocks
  ctx.fillStyle = "red";
  blocks.forEach(b =>
    ctx.fillRect(b.x, b.y, BLOCK_SIZE, BLOCK_SIZE)
  );

  // Score
  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.textAlign = "left";
  ctx.fillText(`Score: ${score}`, 10, 24);
  ctx.fillText(`High: ${highScore}`, 10, 44);

  // Game Over
  if (!running) {
    ctx.textAlign = "center";
    ctx.font = "24px Arial";
    ctx.fillText(
      "GAME OVER",
      SCREEN_WIDTH / 2,
      SCREEN_HEIGHT / 2 - 10
    );
    ctx.font = "16px Arial";
    ctx.fillText(
      "Tap or Press Any Key to Restart",
      SCREEN_WIDTH / 2,
      SCREEN_HEIGHT / 2 + 20
    );
  }
}

// ===== Loop =====
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
