<!-- ====================== MAIN CONTACT SECTION ====================== -->
<main class="flex-row contact-main">
  <!-- Left Column: Band Photo -->
  <div class="col contact-photo">
    <img src="images/thunderchildlive2.jpg" alt="Thunder Child Band" class="full-width-img">
  </div>

  <!-- Right Column: Email Sign-Up -->
  <div class="col contact-form">
    <h2>Stay in the Loop</h2>
    <p>Sign up for our email list to get the latest updates on shows, new music, and more!</p>
  <form id="email-form" action="https://script.google.com/macros/s/AKfycbzWn-EdzDXJgixnpQL0xsKI3GlfafcrmOLrOV81wcXOmkHpPZNYJOf4Q0F9lJF9oJG_mw/exec" method="POST">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Your Name" required>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="Your Email" required>

  <label for="phone">Phone (optional):</label>
  <input type="tel" id="phone" name="phone" placeholder="Your Phone Number">

  <button type="submit">Subscribe</button>
</form>

  </div>
</main>

<script src="script.js"></script>

  <script>
const form = document.getElementById('email-form');

form.addEventListener('submit', async (e) => {
  e.preventDefault(); // stops the page from reloading

  const formData = new FormData(form);

  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (result.status === 'success') {
      alert("Thanks for signing up!");
      form.reset();
    } else {
      alert("Oops! Something went wrong. Please try again.");
    }
  } catch (error) {
    alert("Error submitting the form. Please try again.");
    console.error(error);
  }
});
</script>
