<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brake Down</title>
<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
  overflow:hidden;
  touch-action:none;
}
canvas { display:none; margin:auto; }
#menu {
  text-align:center;
  padding-top:100px;
}
button {
  display:block;
  margin:12px auto;
  padding:12px 28px;
  font-size:22px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="menu">
  <h2 id="highScoreText"></h2>
  <button onclick="startGame('hard')">Hard</button>
  <button onclick="startGame('harder')">Harder</button>
  <button onclick="startGame('glutton')">I'm a Glutton for Punishment</button>
</div>

<canvas id="game" width="375" height="812"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const BAR_HEIGHT = 60;
const HALF_BAR = BAR_HEIGHT / 2;
const GAP_HEIGHT = BAR_HEIGHT;

const TOP_BAR_Y = H/2 - GAP_HEIGHT/2 - HALF_BAR;
const BOTTOM_BAR_Y = H/2 + GAP_HEIGHT/2;

const HOLE_WIDTH = 80;
const SLIDE_SPEED = 4.5;

const INITIAL_FALL_SPEED = 2.2;
const FALL_INC = 0.3;
const SCORE_INTERVAL = 20;

let difficulty = "harder";
let state = "menu";

let holeXTop = W/2 - HOLE_WIDTH/2;
let holeXBottom = W/2 - HOLE_WIDTH/2;

let hold = false;          // Hard / Harder
let holdTop = false;      // Glutton
let holdBottom = false;   // Glutton


let blocks = [];
let score = 0;
let highScore = localStorage.getItem("bd_high") || 0;
document.getElementById("highScoreText").innerText = "High Score: " + highScore;

class Block {
  constructor(fromTop=true){
    this.fromTop = fromTop;
    this.width = HOLE_WIDTH * 0.45;
    this.x = Math.random() * (W - this.width);
    this.y = fromTop ? -40 : H + 40;
    this.speed = INITIAL_FALL_SPEED;
    this.scoredTop = false;
    this.scoredBottom = false;
  }
  update(){
    this.y += this.fromTop ? this.speed : -this.speed;
  }
  draw(){
    ctx.fillStyle="white";
    ctx.fillRect(this.x,this.y,this.width,40);
  }
}

function getHoleLeft(x){
  let l = x % W;
  if(l<0) l+=W;
  return l;
}

function fitsHole(block, holeX){
  const bl = block.x;
  const br = block.x + block.width;
  const hl = getHoleLeft(holeX);
  const hr = hl + HOLE_WIDTH;

  if(hr <= W){
    return bl >= hl && br <= hr;
  } else {
    return (bl >= hl && br <= W) || (bl >= 0 && br <= hr-W);
  }
}

function startGame(mode){
  difficulty = mode;
  document.getElementById("menu").style.display="none";
  canvas.style.display="block";
  resetGame();
}

function resetGame(){
  blocks=[];
  score=0;
  state="playing";
  holeXTop = holeXBottom = W/2 - HOLE_WIDTH/2;
}

function spawnBlock(){
  blocks.push(new Block(Math.random()<0.5));
}

function update(){
  if(state!=="playing") return;

 if(difficulty !== "glutton"){
  if(!hold) holeXTop -= SLIDE_SPEED;
  holeXBottom = holeXTop;
} else {
  if(!holdTop) holeXTop -= SLIDE_SPEED;
  if(!holdBottom) holeXBottom += SLIDE_SPEED;
}

  if(Math.random()<0.02) spawnBlock();

  blocks.forEach(b=>{
    b.update();

    if(b.fromTop && !b.scoredTop && b.y+40>TOP_BAR_Y+HALF_BAR){
      if(!fitsHole(b,holeXTop)) state="game_over";
      b.scoredTop=true;
    }
    if(!b.fromTop && !b.scoredBottom && b.y<BOTTOM_BAR_Y){
      if(!fitsHole(b,holeXBottom)) state="game_over";
      b.scoredBottom=true;
    }

    if(b.scoredTop && b.scoredBottom){
      score++;
      b.scoredTop=b.scoredBottom=false;
    }
  });

  blocks = blocks.filter(b=>b.y>-100 && b.y<H+100);
}

function drawBar(y,holeX){
  ctx.fillStyle="white";
  ctx.fillRect(0,y,W,HALF_BAR);
  let hl=getHoleLeft(holeX);
  ctx.fillStyle="black";
  ctx.fillRect(hl,y,HOLE_WIDTH,HALF_BAR);
  if(hl+HOLE_WIDTH>W){
    ctx.fillRect(hl-W,y,HOLE_WIDTH,HALF_BAR);
  }
}

function draw(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,W,H);

  drawBar(TOP_BAR_Y,holeXTop);
  drawBar(BOTTOM_BAR_Y,holeXBottom);

  blocks.forEach(b=>b.draw());

  ctx.fillStyle="white";
  ctx.font="32px Arial";
  ctx.fillText(score,30,110);

  if(state==="game_over"){
    ctx.fillStyle="rgba(0,0,0,0.6)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="red";
    ctx.font="42px Arial";
    ctx.textAlign="center";
    ctx.fillText("GAME OVER",W/2,H/2);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* INPUT */

  function tryReset(){
  if(state === "game_over"){
    resetGame();
  }
}
window.addEventListener("keydown", e => {
  tryReset();

  if(difficulty === "glutton"){
    if(e.key==="a"||e.key==="ArrowLeft") holdTop=true;
    if(e.key==="d"||e.key==="ArrowRight") holdBottom=true;
  } else {
    hold = true;
  }
});
window.addEventListener("keyup",()=>{
  hold=false;
  holdTop=false;
  holdBottom=false;
});
canvas.addEventListener("mousedown", e => {
  tryReset();

  if(difficulty === "glutton"){
    if(e.offsetY < H/2) holdTop = true;
    else holdBottom = true;
  } else {
    hold = true;
  }
});
canvas.addEventListener("mouseup",()=>{
  hold=false;
  holdTop=false;
  holdBottom=false;
});
</script>
</body>
</html>
