<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunder Child – Show Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Slab&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="archive-page">

<div class="archive-home">
  <a href="index.html" class="home-btn">Home</a>
</div>

<!-- MATCHES MAIN SITE HEADER STYLING -->
<header class="hero">
  <div class="header-content">
    <img src="images/thunderchild2.png" alt="Thunder Child Band" class="logo">
  </div>
</header>

<main class="archive-container">

  <!-- IMAGE SHOW -->
  <div class="archive-show">
    <div class="archive-image">
      <img src="images/pub110725.jpg" alt="Legends Pub Show">
    </div>
    <div class="archive-details">
      <h2>November 7, 2025</h2>
      <p>Legends Pub – Lafayette, LA</p>
    </div>
  </div>

  <!-- VIDEO SHOW -->
  <div class="archive-show">
    <div class="archive-video">
      <iframe
        src="https://www.youtube.com/embed/-hg2nxXHioo"
        title="Thunder Child Live"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <div class="archive-details">
      <h2>January 17, 2026</h2>
      <p>Gloria's – Lafayette, LA</p>
    </div>
  </div>

</main>

<!-- MATCHES MAIN SITE FOOTER STRUCTURE -->
<footer>
  <div class="social-links">
    <a href="https://instagram.com/thunderchildband" target="_blank">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="23" fill="white"/>
        <circle cx="24" cy="24" r="20" fill="black"/>
        <rect x="16" y="16" width="16" height="16" rx="4.5" stroke="white" stroke-width="2" fill="none"/>
        <circle cx="24" cy="24" r="4.5" stroke="white" stroke-width="2" fill="none"/>
        <circle cx="29" cy="19" r="1.8" fill="white"/>
      </svg>
    </a>

    <a href="https://facebook.com/thunderchildbandLA" target="_blank">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="23" fill="white"/>
        <circle cx="24" cy="24" r="20" fill="black"/>
        <path d="M25.2 17h3.2v-3.2h-3.2c-2.7 0-4.8 2.1-4.8 4.8v3.2H17v3.2h3.4v8.8h3.4v-8.8h3l0.8-3.2h-3.8v-3.2c0-0.9 0.7-1.6 1.6-1.6z" fill="white"/>
      </svg>
    </a>

    <a href="mailto:contact@thunderchildband.com">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="23" fill="white"/>
        <circle cx="24" cy="24" r="20" fill="black"/>
        <rect x="15" y="17" width="18" height="14" rx="2" stroke="white" stroke-width="2" fill="none"/>
        <polyline points="15,17 24,26 33,17" fill="none" stroke="white" stroke-width="2"/>
      </svg>
    </a>
  </div>

  <p>© <span id="year"></span> Thunder Child Band</p>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
