<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - Band Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="archive-page">

  <!-- ====== HERO / HEADER ====== -->
  <header class="hero">
    <div class="header-content">
      <img src="images/logo.png" alt="Band Logo" class="logo">

      <!-- Mobile Menu Button -->
      <button class="menu-btn">
        <span class="icon">&#9776;</span>
        <span class="text">Menu</span>
      </button>

      <!-- Social Links -->
      <div class="social-links">
        <a href="#" target="_blank">IG</a>
        <a href="#" target="_blank">FB</a>
        <a href="#" target="_blank">YT</a>
      </div>
    </div>
  </header>

  <!-- ====== NAVIGATION ====== -->
  <nav class="desktop-nav">
    <ul>
      <li><a href="index.html#shows">Shows</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#band">Band</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="archive.html">Archive</a></li>
    </ul>
  </nav>

  <!-- ====== MOBILE NAV ====== -->
  <nav class="mobile-nav">
    <ul>
      <li><a href="index.html#shows">Shows</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#band">Band</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="archive.html">Archive</a></li>
    </ul>
  </nav>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="archive-container">
    <h1>Past Shows & Videos</h1>

    <!-- Single Show -->
    <div class="archive-show">
      <div class="archive-image">
        <img src="images/show1.jpg" alt="Show 1">
      </div>
      <div class="archive-details">
        <h2>Show Name 1</h2>
        <p>Date: January 1, 2025</p>
        <p>Venue: The Big Club</p>
        <div class="archive-video">
          <iframe src="https://www.youtube.com/embed/VIDEO_ID1" title="Show 1 Video" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <!-- Another Show -->
    <div class="archive-show">
      <div class="archive-image">
        <img src="images/show2.jpg" alt="Show 2">
      </div>
      <div class="archive-details">
        <h2>Show Name 2</h2>
        <p>Date: February 15, 2025</p>
        <p>Venue: Music Hall</p>
        <div class="archive-video">
          <iframe src="https://www.youtube.com/embed/VIDEO_ID2" title="Show 2 Video" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <!-- Repeat the above block for more shows -->
  </main>

  <!-- ====== FOOTER ====== -->
  <footer>
    <p>&copy; 2026 Band Name. All Rights Reserved.</p>
  </footer>

  <!-- ====== SCRIPT ====== -->
  <script>
    // Mobile Menu Toggle
    const menuBtn = document.querySelector('.menu-btn');
    const mobileNav = document.querySelector('.mobile-nav');
    menuBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
    });

    // Optional: header shrink on scroll (matches index)
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        document.body.classList.add('scrolled');
      } else {
        document.body.classList.remove('scrolled');
      }
    });
  </script>

</body>
</html>
